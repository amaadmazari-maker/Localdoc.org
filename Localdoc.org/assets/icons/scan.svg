<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="scanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#scanGrad)" filter="url(#scanGlow)"/>
  <!-- Camera Body -->
  <rect x="16" y="22" width="32" height="24" rx="5" fill="#FFFFFF"/>
  <!-- Camera Lens -->
  <circle cx="32" cy="34" r="7" fill="#047857"/>
  <circle cx="32" cy="34" r="4.5" fill="#10B981"/>
  <circle cx="30.5" cy="32.5" r="1.5" fill="#FFFFFF"/>
  <!-- Flash & Viewfinder -->
  <path d="M26 19 H38 L40 22 H24 Z" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="42" cy="26" r="1.5" fill="#047857"/>
  <!-- Laser / Magic Scanner Lines -->
  <line x1="12" y1="34" x2="52" y2="34" stroke="#FDE047" stroke-width="2" stroke-dasharray="3 2"/>
</svg>
