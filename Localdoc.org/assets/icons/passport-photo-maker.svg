<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="passGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#passGrad)" filter="url(#passGlow)"/>
  <!-- Passport Booklet -->
  <rect x="18" y="16" width="28" height="36" rx="3" fill="#1E40AF" stroke="#F59E0B" stroke-width="1.2"/>
  <!-- Gold Biometric Emblem / Globe -->
  <circle cx="32" cy="28" r="6" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
  <line x1="26" y1="28" x2="38" y2="28" stroke="#F59E0B" stroke-width="1"/>
  <ellipse cx="32" cy="28" rx="3" ry="6" stroke="#F59E0B" stroke-width="1" fill="none"/>
  <!-- Biometric Symbol at Bottom -->
  <rect x="28" y="39" width="8" height="4" rx="1" stroke="#F59E0B" stroke-width="1" fill="none"/>
  <circle cx="32" cy="41" r="1" fill="#F59E0B"/>
</svg>
