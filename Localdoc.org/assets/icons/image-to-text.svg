<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ocrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <filter id="ocrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#ocrGrad)" filter="url(#ocrGlow)"/>
  <!-- Scanning Corner Brackets -->
  <path d="M16 22 V18 H20 M44 18 H48 V22 M16 42 V46 H20 M48 42 V46 H44" stroke="#A5F3FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- OCR Text Lines Inside -->
  <text x="32" y="31" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF" text-anchor="middle">OCR</text>
  <line x1="22" y1="36" x2="42" y2="36" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="40" y2="40" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Red/Yellow Neural Laser Scan Beam -->
  <line x1="14" y1="28" x2="50" y2="28" stroke="#FDE047" stroke-width="2"/>
</svg>
