    /* Physical Calculator Body Styling */
    body {
      background: #0B0F19;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .calc-app-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px 40px;
    }

    /* Handheld Scientific Calculator Chassis */
    .fx-calculator {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      border-radius: 36px 36px 28px 28px;
      padding: 22px 18px 24px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.75),
        inset 0 1px 1px rgba(255, 255, 255, 0.2),
        inset 0 -2px 4px rgba(0, 0, 0, 0.5);
      border: 2px solid #334155;
      position: relative;
      user-select: none;
    }

    /* Top Badging & Solar Cell */
    .fx-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 6px;
    }
    .fx-brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #E2E8F0;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
    }
    .fx-brand-subtitle {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38BDF8;
      margin-top: 1px;
    }

    /* Realistic Solar Cell */
    .fx-solar-panel {
      width: 86px;
      height: 24px;
      background: linear-gradient(90deg, #38271D 0%, #451A03 50%, #38271D 100%);
      border: 1.5px solid #1E293B;
      border-radius: 3px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      padding: 1px;
    }
    .fx-solar-cell {
      background: rgba(217, 119, 6, 0.15);
      border-right: 1px solid rgba(0,0,0,0.4);
    }

    /* Natural Dot-Matrix LCD Display Screen */
    .fx-screen-bezel {
      background: #020617;
      border-radius: 12px;
      padding: 8px;
      border: 2px solid #1E293B;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.9);
      margin-bottom: 16px;
    }
    .fx-lcd-screen {
      background: #C2D7B4; /* Authentic Casio Gray-Green LCD */
      border-radius: 6px;
      padding: 8px 12px;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    /* LCD Status Icons Header */
    .fx-lcd-indicators {
      display: flex;
      gap: 8px;
      font-size: 0.68rem;
      font-weight: 800;
      color: #2F3E28;
      letter-spacing: 0.5px;
      height: 14px;
      align-items: center;
    }
    .fx-lcd-indicator {
      opacity: 0.2;
      transition: opacity 0.1s ease;
    }
    .fx-lcd-indicator.active {
      opacity: 1;
    }

    /* LCD Expressions Lines */
    .fx-lcd-expr {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1A2416;
      text-align: left;
      overflow-x: auto;
      white-space: nowrap;
      min-height: 24px;
      line-height: 1.2;
    }
    .fx-lcd-result {
      font-size: 1.85rem;
      font-weight: 900;
      color: #111810;
      text-align: right;
      overflow-x: auto;
      white-space: nowrap;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    /* Top Control Row: Shift, Alpha, Replay D-Pad, Mode, On */
    .fx-top-controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1.6fr 1fr 1fr;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    .fx-ctrl-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 9999px;
      height: 32px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #F1F5F9;
      cursor: pointer;
      box-shadow: 0 3px 0 #1E293B, 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.08s ease;
      user-select: none;
    }
    .fx-ctrl-btn:active, .fx-ctrl-btn.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1E293B;
    }
    .fx-btn-shift {
      background: #475569;
      color: #F59E0B; /* Golden shift */
      border-color: #D97706;
    }
    .fx-btn-shift.active {

      color: #FFF;
    }
    .fx-btn-alpha {
      background: #475569;
      color: #F43F5E; /* Red/pink alpha */
      border-color: #E11D48;
    }
    .fx-btn-alpha.active {
      background: #E11D48;
      color: #FFF;
    }

    /* Central Oval REPLAY D-Pad */

      position: relative;
      width: 72px;
      height: 48px;
      margin: 0 auto;
      background: #1E293B;
      border: 2px solid #475569;
      border-radius: 50%;

      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #0F172A, inset 0 1px 2px rgba(255,255,255,0.15);
      cursor: pointer;
    }
    .fx-dpad-label {
      font-size: 0.58rem;
      font-weight: 800;
      color: #64748B;
      letter-spacing: 0.5px;
    }
    .fx-dpad-arrow {

      font-size: 0.6rem;
      color: #94A3B8;

    .fx-arrow-up { top: 2px; }
    .fx-arrow-down { bottom: 2px; }
    .fx-arrow-left { left: 4px; }
    .fx-arrow-right { right: 4px; }

    /* Keypad Grid (Scientific Functions) */

      grid-template-columns: repeat(6, 1fr);

    /* Main Number Pad Grid */

  <script>
    // State
    let expr = '';
    let result = '0';
    let ans = '0';
    let isShift = false;
    let isAlpha = false;
    let angleUnit = 'DEG'; // 'DEG' or 'RAD'
    let memoryVal = 0;
    let hasMemoryVal = false;
    let isNewCalculation = false;
    let tapeHistory = [];

    // Synthesized Audio Click Effect
    let audioCtx = null;
    function playKeyClick() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.025);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.025);
      } catch (e) {}
    }

    const exprLine = document.getElementById("fx-expr-line");
    const resultLine = document.getElementById("fx-result-line");
    const indShift = document.getElementById("ind-shift");
    const indAlpha = document.getElementById("ind-alpha");
    const indM = document.getElementById("ind-m");
    const indDeg = document.getElementById("ind-deg");
    const indRad = document.getElementById("ind-rad");
    const tapeList = document.getElementById("fx-tape-list");

    function updateLCD() {
      exprLine.textContent = expr || '0';
      resultLine.textContent = result || '0';
      indShift.classList.toggle("active", isShift);
      indAlpha.classList.toggle("active", isAlpha);
      indM.classList.toggle("active", hasMemoryVal);
      indDeg.classList.toggle("active", angleUnit === 'DEG');
      indRad.classList.toggle("active", angleUnit === 'RAD');
    }

    // Toggle Shift
    document.getElementById("btn-shift").addEventListener("click", () => {
      playKeyClick();
      isShift = !isShift;
      if (isShift) isAlpha = false;
      document.getElementById("btn-shift").classList.toggle("active", isShift);
      document.getElementById("btn-alpha").classList.remove("active");
      updateLCD();
    });

    // Toggle Alpha
    document.getElementById("btn-alpha").addEventListener("click", () => {
      playKeyClick();
      isAlpha = !isAlpha;
      if (isAlpha) isShift = false;
      document.getElementById("btn-alpha").classList.toggle("active", isAlpha);
      document.getElementById("btn-shift").classList.remove("active");
      updateLCD();
    });

    // Toggle Mode (DEG / RAD)
    document.getElementById("btn-mode").addEventListener("click", () => {
      playKeyClick();
      angleUnit = (angleUnit === 'DEG') ? 'RAD' : 'DEG';
      UIUtils.showToast("Angle unit: " + angleUnit, "info");
      updateLCD();
      if (expr) evaluateLive();
    });

    // ON Button
    document.getElementById("btn-on").addEventListener("click", () => {
      playKeyClick();
      expr = '';
      result = '0';
      isShift = false;
      isAlpha = false;
      document.getElementById("btn-shift").classList.remove("active");
      document.getElementById("btn-alpha").classList.remove("active");
      updateLCD();
    });

    // Numeric Keys & Basic Ops
    document.querySelectorAll(".fx-num-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        playKeyClick();
        const key = btn.getAttribute("data-key");
        handleKey(key);
      });
    });

    // Functions
    document.querySelectorAll(".fx-fn-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        playKeyClick();
        const fn = btn.getAttribute("data-fn");
        handleFn(fn);
      });
    });

    function handleKey(key) {
      if (key === 'ac') {
        expr = '';
        result = '0';
        isNewCalculation = false;
      } else if (key === 'del') {
        if (expr.length > 0) {
          expr = expr.slice(0, -1);
        }
      } else if (key === '=') {
        calculateFinal();
        return;
      } else if (key === 'ans') {
        expr += ans;
      } else if (key === 'exp') {
        expr += 'e';
      } else {
        if (isNewCalculation && !['+', '-', '*', '/'].includes(key)) {
          expr = '';
          isNewCalculation = false;
        }
        expr += key;
      }
      updateLCD();
      evaluateLive();
    }

    function handleFn(fn) {
      if (fn === 'sin') {
        expr += isShift ? 'asin(' : 'sin(';
      } else if (fn === 'cos') {
        expr += isShift ? 'acos(' : 'cos(';
      } else if (fn === 'tan') {
        expr += isShift ? 'atan(' : 'tan(';
      } else if (fn === 'sqrt') {
        expr += isShift ? 'cbrt(' : 'sqrt(';
      } else if (fn === 'square') {
        expr += isShift ? '^3' : '^2';
      } else if (fn === 'power') {
        expr += '^';
      } else if (fn === 'log') {
        expr += isShift ? '10^(' : 'log(';
      } else if (fn === 'ln') {
        expr += isShift ? 'exp(' : 'ln(';
      } else if (fn === 'pi') {
        expr += 'π';
      } else if (fn === 'reciprocal') {
        expr += '^(-1)';
      } else if (fn === 'negate') {
        expr += '-';
      } else if (fn === 'paren-left') {
        expr += '(';
      } else if (fn === 'paren-right') {
        expr += ')';
      } else if (fn === 'fact') {
        expr += '!';
      } else if (fn === 'fraction') {
        expr += '/';
      } else if (fn === 'm-plus') {
        try {
          const val = parseFloat(result || '0');
          memoryVal += (isShift ? -val : val);
          hasMemoryVal = (memoryVal !== 0);
          UIUtils.showToast("Memory M = " + memoryVal, "info");
        } catch (e) {}
      } else if (fn === 'mr') {
        if (isShift) {
          memoryVal = 0;
          hasMemoryVal = false;
          UIUtils.showToast("Memory Cleared", "info");
        } else {
          expr += memoryVal.toString();
        }
      } else if (fn === 'sd') {
        // Toggle fraction vs decimal
        try {
          const num = parseFloat(result);
          if (!isNaN(num) && Number.isInteger(num * 100)) {
            result = toFraction(num);
          } else {
            result = evaluateExpression(expr).toString();
          }
        } catch (e) {}
      }

      if (isShift) {
        isShift = false;
        document.getElementById("btn-shift").classList.remove("active");
      }
      updateLCD();
      evaluateLive();
    }

    function evaluateLive() {
      if (!expr) {
        result = '0';
        updateLCD();
        return;
      }
      try {
        const val = evaluateExpression(expr);
        if (!isNaN(val) && isFinite(val)) {
          result = formatResult(val);
        }
      } catch (e) {
        // Non-blocking live preview
      }
      updateLCD();
    }

    function calculateFinal() {
      if (!expr) return;
      try {
        const val = evaluateExpression(expr);
        if (isNaN(val) || !isFinite(val)) {
          result = 'Math ERROR';
        } else {
          result = formatResult(val);
          ans = result;
          isNewCalculation = true;
          addTapeEntry(expr, result);
        }
      } catch (e) {
        result = 'Syntax ERROR';
      }
      updateLCD();
    }

    function formatResult(num) {
      if (Math.abs(num) > 1e12 || (Math.abs(num) < 1e-6 && num !== 0)) {
        return num.toExponential(6).replace('e+', 'e');
      }
      return parseFloat(num.toFixed(8)).toString();
    }

    function toFraction(val) {
      let tolerance = 1.0e-6;
      let h1 = 1, h2 = 0, k1 = 0, k2 = 1;
      let b = val;
      do {
        let a = Math.floor(b);
        let aux = h1; h1 = a * h1 + h2; h2 = aux;
        aux = k1; k1 = a * k1 + k2; k2 = aux;
        b = 1 / (b - a);
      } while (Math.abs(val - h1 / k1) > val * tolerance);
      return `${h1}/${k1}`;
    }

    // Safe mathematical parser
    function evaluateExpression(s) {
      let parsed = s
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-')
        .replace(/π/g, 'Math.PI')
        .replace(/e/g, 'Math.E');

      // Factorial replacement: 5! -> factorial(5)
      parsed = parsed.replace(/(\d+)!/g, (_, n) => factorial(parseInt(n)));

      // Powers: x^y -> Math.pow(x,y)
      parsed = parsed.replace(/([0-9\.]+|\([^\)]+\))\^([0-9\.]+|\([^\)]+\))/g, 'Math.pow($1,$2)');

      // Trig & Logs
      const degFactor = (angleUnit === 'DEG') ? '(Math.PI/180)*' : '';
      const radFactor = (angleUnit === 'DEG') ? '*(180/Math.PI)' : '';

      parsed = parsed.replace(/sin\(/g, `Math.sin(${degFactor}`);
      parsed = parsed.replace(/cos\(/g, `Math.cos(${degFactor}`);
      parsed = parsed.replace(/tan\(/g, `Math.tan(${degFactor}`);
      parsed = parsed.replace(/asin\(/g, `(${radFactor}Math.asin(`);
      parsed = parsed.replace(/acos\(/g, `(${radFactor}Math.acos(`);
      parsed = parsed.replace(/atan\(/g, `(${radFactor}Math.atan(`);
      parsed = parsed.replace(/sqrt\(/g, 'Math.sqrt(');
      parsed = parsed.replace(/cbrt\(/g, 'Math.cbrt(');
      parsed = parsed.replace(/log\(/g, 'Math.log10(');
      parsed = parsed.replace(/ln\(/g, 'Math.log(');

      // Evaluate safely
      return Function(`'use strict'; return (${parsed})`)();
    }

    function factorial(n) {
      if (n < 0) return NaN;
      if (n === 0 || n === 1) return 1;
      let r = 1;
      for (let i = 2; i <= Math.min(n, 170); i++) r *= i;
      return r;
    }

    function addTapeEntry(e, r) {
      tapeHistory.unshift({ expr: e, res: r });
      if (tapeHistory.length > 20) tapeHistory.pop();
      renderTape();
    }

    function renderTape() {
      if (tapeHistory.length === 0) {
        tapeList.innerHTML = '<div style="color:#64748B; font-size:0.8rem; text-align:center; padding:10px;">Calculations appear here</div>';
        return;
      }
      tapeList.innerHTML = tapeHistory.map(item => `
        <div class="fx-tape-item" onclick="restoreTape('${item.expr.replace(/'/g, "\\'")}', '${item.res}')">
          <span style="color:#94A3B8;">${item.expr}</span>
          <span style="font-weight:800; color:#38BDF8;">= ${item.res}</span>
        </div>
      `).join('');
    }

    window.restoreTape = function(e, r) {
      expr = e;
      result = r;
      updateLCD();
    };

    document.getElementById("btn-clear-tape").addEventListener("click", () => {
      tapeHistory = [];
      renderTape();
    });

    // Keyboard bindings
    document.addEventListener("keydown", (e) => {
      if (e.key >= '0' && e.key <= '9') handleKey(e.key);
      else if (e.key === '.') handleKey('.');
      else if (e.key === '+') handleKey('+');
      else if (e.key === '-') handleKey('-');
      else if (e.key === '*') handleKey('*');
      else if (e.key === '/') { e.preventDefault(); handleKey('/'); }
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculateFinal(); }
      else if (e.key === 'Backspace') handleKey('del');
      else if (e.key === 'Escape') handleKey('ac');
      else if (e.key === '(') handleFn('paren-left');
      else if (e.key === ')') handleFn('paren-right');
    });

    updateLCD();
  </script>
</body>
</html>
