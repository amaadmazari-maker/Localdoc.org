<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background: #0f172a; border-radius: 16px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="p-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="p-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="p-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="p-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title Badge & Headers -->
  <rect x="30" y="24" width="310" height="34" rx="17" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="50" cy="41" r="6" fill="#38bdf8" filter="url(#p-glow)"/>
  <text x="68" y="47" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">ICAO DOC 9303 / ISO 19794-5</text>

  <text x="30" y="90" fill="#f8fafc" font-size="22" font-weight="800">Biometric Passport Photo Head-to-Chin Ratio</text>
  <text x="30" y="114" fill="#94a3b8" font-size="14">Standard 2x2 inch (51x51mm) &amp; 35x45mm Biometric Height Zone (50% – 69%)</text>

  <!-- Photo Silhouette Frame -->
  <g transform="translate(60, 140)">
    <!-- Photo Boundary Canvas -->
    <rect x="0" y="0" width="320" height="400" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Subtle Grid overlay -->
    <line x1="160" y1="0" x2="160" y2="400" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="200" x2="320" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Head & Shoulders Silhouette -->
    <!-- Shoulders -->
    <path d="M 40 400 Q 50 320 120 300 L 200 300 Q 270 320 280 400 Z" fill="#334155" opacity="0.8"/>
    <!-- Neck -->
    <rect x="135" y="250" width="50" height="60" rx="4" fill="#475569" opacity="0.6"/>
    <!-- Head Oval -->
    <ellipse cx="160" cy="180" rx="72" ry="92" fill="#475569" opacity="0.75"/>
    <ellipse cx="160" cy="180" rx="68" ry="88" fill="#334155"/>

    <!-- Eye Line -->
    <line x1="100" y1="172" x2="220" y2="172" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="132" cy="172" r="5" fill="#38bdf8"/>
    <circle cx="188" cy="172" r="5" fill="#38bdf8"/>

    <!-- Vertical Symmetry Axis -->
    <line x1="160" y1="20" x2="160" y2="380" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Top Margin Guide (Crown to Top Edge) -->
    <!-- Crown point: y = 88 -->
    <!-- Top edge: y = 0 -->
    <line x1="0" y1="88" x2="320" y2="88" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,5"/>
    <line x1="290" y1="0" x2="290" y2="88" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="290,0 286,10 294,10" fill="#f59e0b"/>
    <polygon points="290,88 286,78 294,78" fill="#f59e0b"/>
    <rect x="230" y="32" width="54" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="257" y="48" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">8-12%</text>

    <!-- Chin Line: y = 272 -->
    <line x1="0" y1="272" x2="320" y2="272" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,5"/>

    <!-- Head Height Span (Crown y=88 to Chin y=272 = 184px = 46% of 400px, zone is 50-69%) -->
    <rect x="15" y="88" width="8" height="184" fill="#0ea5e9" rx="4" opacity="0.3"/>
    <line x1="19" y1="88" x2="19" y2="272" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="19,88 15,98 23,98" fill="#38bdf8"/>
    <polygon points="19,272 15,262 23,262" fill="#38bdf8"/>

    <!-- Dimension Bracket Width -->
    <line x1="0" y1="412" x2="320" y2="412" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="406" x2="0" y2="418" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="320" y1="406" x2="320" y2="418" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="160" y="428" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Width: 2.0 in (51mm) / 35mm</text>
  </g>

  <!-- Technical Spec & Rule Cards on Right -->
  <g transform="translate(420, 140)">
    <!-- Card 1: 50% - 69% Head Height Rule -->
    <rect x="0" y="0" width="340" height="96" rx="12" fill="url(#p-card)" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="#0284c7" opacity="0.3"/>
    <text x="24" y="29" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">1</text>
    <text x="48" y="28" fill="#f8fafc" font-size="15" font-weight="700">The 50% – 69% Crown-to-Chin Rule</text>
    <text x="16" y="52" fill="#cbd5e1" font-size="12">Total head height from crown (top of hair) to bottom of</text>
    <text x="16" y="70" fill="#cbd5e1" font-size="12">chin must measure between <tspan fill="#38bdf8" font-weight="700">1.0″ – 1.375″ (25 – 35mm)</tspan>.</text>
    <text x="16" y="86" fill="#94a3b8" font-size="11">Enforced by US State Dept, NADRA, Schengen &amp; UK HMPO.</text>

    <!-- Card 2: Eye Level Placement -->
    <rect x="0" y="112" width="340" height="90" rx="12" fill="url(#p-card)" stroke="#059669" stroke-width="1.5"/>
    <circle cx="24" cy="136" r="12" fill="#059669" opacity="0.3"/>
    <text x="24" y="141" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">2</text>
    <text x="48" y="140" fill="#f8fafc" font-size="15" font-weight="700">Eye Height Ratio (56% – 69%)</text>
    <text x="16" y="164" fill="#cbd5e1" font-size="12">Horizontal eye axis must sit between <tspan fill="#34d399" font-weight="700">28mm – 35mm</tspan></text>
    <text x="16" y="182" fill="#cbd5e1" font-size="12">above the bottom edge of the finished passport crop.</text>

    <!-- Card 3: Top Crown Clearance -->
    <rect x="0" y="218" width="340" height="90" rx="12" fill="url(#p-card)" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="24" cy="242" r="12" fill="#d97706" opacity="0.3"/>
    <text x="24" y="247" fill="#fbbf24" font-size="12" font-weight="800" text-anchor="middle">3</text>
    <text x="48" y="246" fill="#f8fafc" font-size="15" font-weight="700">Top Margin Clearance (8% – 12%)</text>
    <text x="16" y="270" fill="#cbd5e1" font-size="12">Hairline must not touch upper boundary. Maintain a</text>
    <text x="16" y="288" fill="#cbd5e1" font-size="12"><tspan fill="#fbbf24" font-weight="700">3mm – 5mm plain margin</tspan> for biometric margin scanners.</text>

    <!-- Verification Badge Footer -->
    <rect x="0" y="324" width="340" height="66" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="348" fill="#38bdf8" font-size="12" font-weight="700">⚡ Automated in LocalDoc Photo Suite</text>
    <text x="16" y="368" fill="#94a3b8" font-size="11">Pre-calibrated overlays for CNIC, US Visa, Schengen &amp; UK.</text>
  </g>
</svg>