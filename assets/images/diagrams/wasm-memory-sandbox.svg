<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" width="100%" height="100%" style="background: #080c14; border-radius: 16px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="w-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cloud-threat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="wasm-shield" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="w-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title Badge -->
  <rect x="30" y="24" width="310" height="34" rx="17" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="50" cy="41" r="6" fill="#38bdf8" filter="url(#w-glow)"/>
  <text x="68" y="47" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">ZERO-UPLOAD MEMORY MODEL</text>

  <text x="30" y="90" fill="#f8fafc" font-size="22" font-weight="800">WebAssembly Linear Memory Sandbox vs Cloud</text>
  <text x="30" y="114" fill="#94a3b8" font-size="14">Contrasting Cloud Document Leaks with Local Hardware-Enforced Client Isolation</text>

  <!-- Left Container: Traditional Cloud Processing (Risky) -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="360" height="440" rx="14" fill="#181118" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Banner -->
    <rect x="0" y="0" width="360" height="42" rx="14" fill="#450a0a"/>
    <text x="180" y="26" fill="#fca5a5" font-size="14" font-weight="800" text-anchor="middle">⚠️ TRADITIONAL CLOUD CONVERTERS</text>

    <!-- Client Browser (Upload step) -->
    <rect x="20" y="56" width="320" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="36" y="80" fill="#f8fafc" font-size="13" font-weight="700">1. User Uploads Confidential PDF</text>
    <text x="36" y="100" fill="#94a3b8" font-size="11">Contracts, medical records, ID cards sent over HTTP POST</text>

    <!-- Egress Arrow -->
    <path d="M 180 116 L 180 148" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="180,154 175,144 185,144" fill="#ef4444"/>
    <text x="195" y="138" fill="#fca5a5" font-size="11" font-weight="700">PUBLIC INTERNET EGRESS</text>

    <!-- Remote Cloud Server Box -->
    <rect x="20" y="158" width="320" height="150" rx="8" fill="#2d0a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="36" y="184" fill="#fca5a5" font-size="14" font-weight="800">2. Remote Third-Party Server Cluster</text>
    <text x="36" y="206" fill="#fecaca" font-size="12">• Decrypted and written to temporary server disk cache</text>
    <text x="36" y="226" fill="#fecaca" font-size="12">• Vulnerable to server misconfiguration &amp; data breaches</text>
    <text x="36" y="246" fill="#fecaca" font-size="12">• Retained for training or forensic logging (cloud logs)</text>
    <text x="36" y="266" fill="#fecaca" font-size="12">• Violates strict GDPR / HIPAA data residency laws</text>
    <text x="36" y="292" fill="#ef4444" font-size="11" font-weight="700">❌ High Privacy Risk &amp; Latency</text>

    <!-- Download Arrow -->
    <path d="M 180 308 L 180 340" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="180,346 175,336 185,336" fill="#ef4444"/>

    <!-- Re-Download Step -->
    <rect x="20" y="352" width="320" height="66" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="36" y="376" fill="#f8fafc" font-size="13" font-weight="700">3. Download Processed File</text>
    <text x="36" y="398" fill="#94a3b8" font-size="11">Total time: 8 – 25 seconds depending on connection speed</text>
  </g>

  <!-- Right Container: LocalDoc WebAssembly Architecture (100% Private) -->
  <g transform="translate(430, 140)">
    <rect x="0" y="0" width="380" height="440" rx="14" fill="#0b1727" stroke="#0ea5e9" stroke-width="1.5"/>
    <!-- Banner -->
    <rect x="0" y="0" width="380" height="42" rx="14" fill="#0369a1"/>
    <text x="190" y="26" fill="#f0f9ff" font-size="14" font-weight="800" text-anchor="middle">🛡️ LOCALDOC CLIENT-SIDE WASM SANDBOX</text>

    <!-- User Browser Frame -->
    <rect x="18" y="56" width="344" height="270" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="34" y="80" fill="#38bdf8" font-size="13" font-weight="800">Your Browser (Chrome, Safari, Firefox, Edge)</text>

    <!-- JS Main Thread -->
    <rect x="32" y="96" width="316" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="44" y="116" fill="#f8fafc" font-size="12" font-weight="700">DOM &amp; UI Layer (JavaScript Heap)</text>
    <text x="44" y="134" fill="#94a3b8" font-size="11">Drag-and-drop handler creates local File &amp; ArrayBuffer in RAM</text>

    <!-- Hardware Isolation Boundary -->
    <line x1="32" y1="162" x2="348" y2="162" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="190" y="174" fill="#34d399" font-size="10" font-weight="800" text-anchor="middle">HARDWARE-ENFORCED MEMORY SANDBOX</text>

    <!-- WebAssembly Linear Memory Instance -->
    <rect x="32" y="184" width="316" height="126" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5"/>
    <text x="44" y="206" fill="#6ee7b7" font-size="13" font-weight="800">WebAssembly Linear Memory (RAM)</text>
    <text x="44" y="226" fill="#d1fae5" font-size="11">• Direct C/C++/Rust compiled binary (pdf-lib, muPDF)</text>
    <text x="44" y="244" fill="#d1fae5" font-size="11">• 0 Network Sockets: Cannot make external HTTP requests</text>
    <text x="44" y="262" fill="#d1fae5" font-size="11">• Multi-threaded SIMD &amp; Web Workers for sub-second execution</text>
    <text x="44" y="280" fill="#d1fae5" font-size="11">• 100% Volatile: Zero bytes saved to disk or persistent storage</text>
    <text x="44" y="298" fill="#34d399" font-size="11" font-weight="700">⚡ 0 Bytes Sent Across Network • Instant Download</text>

    <!-- Tab Close / Memory Wipe Card -->
    <rect x="18" y="340" width="344" height="78" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="38" cy="365" r="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="38" y="370" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">✓</text>
    <text x="58" y="365" fill="#f8fafc" font-size="13" font-weight="700">Automatic Complete Memory Wipe</text>
    <text x="58" y="385" fill="#94a3b8" font-size="11">Closing the browser tab instantly releases the Linear Memory</text>
    <text x="58" y="401" fill="#94a3b8" font-size="11">ArrayBuffer back to host OS. No trail remains.</text>
  </g>
</svg>