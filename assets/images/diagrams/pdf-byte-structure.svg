<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="100%" height="100%" style="background: #0b1120; border-radius: 16px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="pdf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="p-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="p-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="p-xref" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="p-trailer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="p-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Badge -->
  <rect x="30" y="24" width="310" height="34" rx="17" fill="#dc2626" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="50" cy="41" r="6" fill="#f87171"/>
  <text x="68" y="47" fill="#fca5a5" font-size="13" font-weight="700" letter-spacing="1">ISO 32000-1 ARCHITECTURE</text>

  <text x="30" y="90" fill="#f8fafc" font-size="22" font-weight="800">PDF Internal Binary Byte Structure</text>
  <text x="30" y="114" fill="#94a3b8" font-size="14">Header, Indirect Object Graph, Cross-Reference (xref) Table &amp; Reverse-Parsed Trailer</text>

  <!-- Byte Stream Representation Column -->
  <g transform="translate(40, 140)">
    <!-- 1. Header Section -->
    <rect x="0" y="0" width="320" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="10" height="70" rx="4" fill="#ef4444"/>
    <text x="24" y="26" fill="#fca5a5" font-size="13" font-weight="700">1. Header (Byte 0)</text>
    <text x="24" y="46" fill="#f8fafc" font-family="monospace" font-size="12">%PDF-1.7</text>
    <text x="24" y="60" fill="#94a3b8" font-family="monospace" font-size="11">%âãÏÓ (Binary signature for byte cleanliness)</text>

    <!-- Flow Arrow 1 -->
    <line x1="160" y1="70" x2="160" y2="86" stroke="#475569" stroke-width="2"/>
    <polygon points="160,88 156,80 164,80" fill="#475569"/>

    <!-- 2. Body Objects Section -->
    <rect x="0" y="90" width="320" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#p-shadow)"/>
    <rect x="0" y="90" width="10" height="150" rx="4" fill="#3b82f6"/>
    <text x="24" y="114" fill="#93c5fd" font-size="13" font-weight="700">2. Body (Indirect Objects)</text>

    <text x="24" y="136" fill="#f8fafc" font-family="monospace" font-size="11">1 0 obj &lt;&lt; /Type /Catalog /Pages 2 0 R &gt;&gt; endobj</text>
    <text x="24" y="156" fill="#f8fafc" font-family="monospace" font-size="11">2 0 obj &lt;&lt; /Type /Pages /Kids [3 0 R] /Count 1 &gt;&gt;</text>
    <text x="24" y="176" fill="#f8fafc" font-family="monospace" font-size="11">3 0 obj &lt;&lt; /Type /Page /Contents 4 0 R &gt;&gt;</text>
    <text x="24" y="196" fill="#60a5fa" font-family="monospace" font-size="11">4 0 obj &lt;&lt; /Length 58 &gt;&gt; stream ... endstream</text>
    <text x="24" y="222" fill="#94a3b8" font-size="11">Text, vectors, embedded fonts &amp; JBIG2/DCT images</text>

    <!-- Flow Arrow 2 -->
    <line x1="160" y1="240" x2="160" y2="256" stroke="#475569" stroke-width="2"/>
    <polygon points="160,258 156,250 164,250" fill="#475569"/>

    <!-- 3. xref Section -->
    <rect x="0" y="260" width="320" height="96" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#p-shadow)"/>
    <rect x="0" y="260" width="10" height="96" rx="4" fill="#10b981"/>
    <text x="24" y="284" fill="#6ee7b7" font-size="13" font-weight="700">3. Cross-Reference (xref) Table</text>
    <text x="24" y="304" fill="#f8fafc" font-family="monospace" font-size="11">xref 0 5</text>
    <text x="24" y="320" fill="#34d399" font-family="monospace" font-size="11">0000000015 00000 n (Byte offset of Obj 1)</text>
    <text x="24" y="336" fill="#34d399" font-family="monospace" font-size="11">0000000078 00000 n (Byte offset of Obj 2)</text>

    <!-- Flow Arrow 3 -->
    <line x1="160" y1="356" x2="160" y2="372" stroke="#475569" stroke-width="2"/>
    <polygon points="160,374 156,366 164,366" fill="#475569"/>

    <!-- 4. Trailer Section -->
    <rect x="0" y="376" width="320" height="74" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#p-shadow)"/>
    <rect x="0" y="376" width="10" height="74" rx="4" fill="#f59e0b"/>
    <text x="24" y="398" fill="#fde68a" font-size="13" font-weight="700">4. Trailer (Parsed Backwards)</text>
    <text x="24" y="418" fill="#f8fafc" font-family="monospace" font-size="11">trailer &lt;&lt; /Size 5 /Root 1 0 R &gt;&gt;</text>
    <text x="24" y="434" fill="#fbbf24" font-family="monospace" font-size="11">startxref 389 %%EOF</text>
  </g>

  <!-- Reverse Parsing Architecture & Local Execution Explanation (Right Column) -->
  <g transform="translate(400, 140)">
    <!-- Explanatory Box 1: Why PDF Parsers Start at the End -->
    <rect x="0" y="0" width="380" height="136" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="28" height="28" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="30" y="35" fill="#fbbf24" font-size="14" font-weight="800" text-anchor="middle">↺</text>
    <text x="56" y="35" fill="#f8fafc" font-size="15" font-weight="700">Why Parsers Read From Bottom to Top</text>
    <text x="16" y="66" fill="#cbd5e1" font-size="12">1. The PDF reader seeks backwards from EOF to find <tspan fill="#fbbf24" font-family="monospace">startxref</tspan>.</text>
    <text x="16" y="86" fill="#cbd5e1" font-size="12">2. It jumps directly to the byte offset of the <tspan fill="#34d399" font-weight="700">xref table</tspan>.</text>
    <text x="16" y="106" fill="#cbd5e1" font-size="12">3. It loads objects on demand via random access byte seeking,</text>
    <text x="16" y="124" fill="#cbd5e1" font-size="12">avoiding parsing multi-gigabyte documents linearly.</text>

    <!-- Explanatory Box 2: Client-Side RAM Advantage -->
    <rect x="0" y="154" width="380" height="154" rx="12" fill="#111827" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="16" y="170" width="28" height="28" rx="6" fill="#0284c7" fill-opacity="0.2"/>
    <text x="30" y="189" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">⚡</text>
    <text x="56" y="189" fill="#f8fafc" font-size="15" font-weight="700">LocalDoc In-Memory WebAssembly Advantage</text>
    <text x="16" y="218" fill="#cbd5e1" font-size="12">• <tspan fill="#38bdf8" font-weight="700">Zero Network Overhead:</tspan> Bytes reside entirely in browser</text>
    <text x="24" y="234" fill="#cbd5e1" font-size="12">ArrayBuffer RAM without uploading to any remote server.</text>
    <text x="16" y="256" fill="#cbd5e1" font-size="12">• <tspan fill="#34d399" font-weight="700">Instant Incremental Updates:</tspan> New objects append to EOF</text>
    <text x="24" y="272" fill="#cbd5e1" font-size="12">with updated xref offsets, enabling sub-second exports.</text>
    <text x="16" y="294" fill="#cbd5e1" font-size="12">• <tspan fill="#f43f5e" font-weight="700">True Redaction:</tspan> Blacked-out bytes are deleted from the obj stream.</text>

    <!-- Explanatory Box 3: PDF/A Archival Mandate -->
    <rect x="0" y="324" width="380" height="126" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="350" fill="#34d399" font-size="14" font-weight="700">ISO 19005 (PDF/A-1b &amp; PDF/A-2b) Standards</text>
    <text x="16" y="374" fill="#cbd5e1" font-size="12">• All fonts must be 100% embedded (no device font calls).</text>
    <text x="16" y="394" fill="#cbd5e1" font-size="12">• Device-independent color profile (ICC OutputIntent).</text>
    <text x="16" y="414" fill="#cbd5e1" font-size="12">• Audio, video, and executable JavaScript actions are forbidden.</text>
    <text x="16" y="434" fill="#94a3b8" font-size="11">Guarantees visual fidelity across 50+ year archival lifespans.</text>
  </g>
</svg>