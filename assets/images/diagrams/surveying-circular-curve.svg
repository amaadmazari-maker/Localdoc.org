<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" width="100%" height="100%" style="background: #090d16; border-radius: 16px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="c-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="c-curve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="c-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Blueprint Header -->
  <rect x="30" y="24" width="320" height="34" rx="17" fill="#4338ca" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="50" cy="41" r="6" fill="#818cf8" filter="url(#c-glow)"/>
  <text x="68" y="47" fill="#a5b4fc" font-size="13" font-weight="700" letter-spacing="1">CIVIL SURVEYING &amp; CASIO fx-5800P</text>

  <text x="30" y="90" fill="#f8fafc" font-size="22" font-weight="800">Horizontal Circular Curve Geometry</text>
  <text x="30" y="114" fill="#94a3b8" font-size="14">Setting Out Formulae: Radius, Tangents, Long Chord, External Distance &amp; Mid-Ordinate</text>

  <!-- Curve Blueprint Graphic (Left/Center) -->
  <g transform="translate(40, 140)">
    <!-- CAD Grid background -->
    <rect x="0" y="0" width="460" height="440" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Center Point O -->
    <circle cx="230" cy="380" r="5" fill="#f43f5e"/>
    <text x="230" y="404" fill="#f43f5e" font-size="14" font-weight="800" text-anchor="middle">O (Center of Curvature)</text>

    <!-- Point of Curvature (PC) & Point of Tangency (PT) -->
    <!-- PC at (80, 200), PT at (380, 200), PI at (230, 60) -->
    <!-- Radius Lines from O(230,380) to PC(80,200) and PT(380,200) -->
    <line x1="230" y1="380" x2="80" y2="200" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="230" y1="380" x2="380" y2="200" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Radius Label R -->
    <text x="140" y="305" fill="#fda4af" font-size="13" font-weight="700">R (Radius)</text>
    <text x="315" y="305" fill="#fda4af" font-size="13" font-weight="700">R (Radius)</text>

    <!-- Subtended Central Angle Δ at O -->
    <path d="M 195 338 A 50 50 0 0 1 265 338" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="230" y="330" fill="#fda4af" font-size="12" font-weight="700" text-anchor="middle">Δ (Angle)</text>

    <!-- Tangents: Back Tangent to PI, Forward Tangent from PI -->
    <!-- PI at (230, 60) -->
    <line x1="20" y1="240" x2="80" y2="200" stroke="#0ea5e9" stroke-width="2.5"/>
    <line x1="80" y1="200" x2="230" y2="60" stroke="#0ea5e9" stroke-width="2.5"/>
    <line x1="230" y1="60" x2="380" y2="200" stroke="#0ea5e9" stroke-width="2.5"/>
    <line x1="380" y1="200" x2="440" y2="240" stroke="#0ea5e9" stroke-width="2.5"/>

    <!-- Deflection Angle Δ at PI -->
    <line x1="230" y1="60" x2="300" y2="-5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 270 23 A 50 50 0 0 1 280 67" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="295" y="45" fill="#fbbf24" font-size="13" font-weight="800">Δ</text>

    <!-- Circular Arc (Curve Path) -->
    <path d="M 80 200 Q 230 148 380 200" fill="none" stroke="url(#c-curve)" stroke-width="5" filter="url(#c-glow)"/>

    <!-- Long Chord C from PC to PT -->
    <line x1="80" y1="200" x2="380" y2="200" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="230" y="218" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Long Chord (C)</text>

    <!-- Middle Ordinate M & External Distance E -->
    <!-- Curve apex is roughly at (230, 168) -->
    <!-- Long chord at y=200, so M = 200 - 168 = 32px -->
    <!-- PI is at y=60, so E = 168 - 60 = 108px -->
    <line x1="230" y1="60" x2="230" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="230" cy="168" r="4" fill="#c084fc"/>

    <!-- External Distance E bracket -->
    <line x1="222" y1="65" x2="222" y2="165" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="214" y="118" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="end">E</text>

    <!-- Mid Ordinate M bracket -->
    <line x1="238" y1="172" x2="238" y2="198" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="246" y="188" fill="#38bdf8" font-size="12" font-weight="700">M</text>

    <!-- Tangent Length T label -->
    <text x="140" y="118" fill="#38bdf8" font-size="13" font-weight="700" transform="rotate(-42 140 118)">T (Tangent)</text>
    <text x="320" y="118" fill="#38bdf8" font-size="13" font-weight="700" transform="rotate(42 320 118)">T (Tangent)</text>

    <!-- Curve Arc Length L label -->
    <text x="230" y="152" fill="#e0e7ff" font-size="13" font-weight="800" text-anchor="middle">Arc Length (L)</text>

    <!-- Points Circles -->
    <!-- PC -->
    <circle cx="80" cy="200" r="6" fill="#0ea5e9"/>
    <rect x="40" y="160" width="80" height="24" rx="4" fill="#0369a1"/>
    <text x="80" y="176" fill="#f0f9ff" font-size="11" font-weight="700" text-anchor="middle">PC (Begin)</text>

    <!-- PI -->
    <circle cx="230" cy="60" r="6" fill="#fbbf24"/>
    <rect x="190" y="20" width="80" height="24" rx="4" fill="#b45309"/>
    <text x="230" y="36" fill="#fffbeb" font-size="11" font-weight="700" text-anchor="middle">PI (Vertex)</text>

    <!-- PT -->
    <circle cx="380" cy="200" r="6" fill="#0ea5e9"/>
    <rect x="340" y="160" width="80" height="24" rx="4" fill="#0369a1"/>
    <text x="380" y="176" fill="#f0f9ff" font-size="11" font-weight="700" text-anchor="middle">PT (End)</text>
  </g>

  <!-- Formulae & Casio-BASIC Code Box on Right -->
  <g transform="translate(520, 140)">
    <!-- Formula Box -->
    <rect x="0" y="0" width="290" height="230" rx="12" fill="url(#c-card)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="16" y="28" fill="#a5b4fc" font-size="14" font-weight="700">Essential Curve Formulas</text>

    <text x="16" y="58" fill="#f8fafc" font-size="12" font-weight="600">Tangent Distance (T):</text>
    <text x="26" y="76" fill="#38bdf8" font-family="monospace" font-size="13">T = R · tan(Δ / 2)</text>

    <text x="16" y="104" fill="#f8fafc" font-size="12" font-weight="600">Length of Curve (L):</text>
    <text x="26" y="122" fill="#38bdf8" font-family="monospace" font-size="13">L = (π · R · Δ) / 180°</text>

    <text x="16" y="150" fill="#f8fafc" font-size="12" font-weight="600">Long Chord (C):</text>
    <text x="26" y="168" fill="#34d399" font-family="monospace" font-size="13">C = 2 · R · sin(Δ / 2)</text>

    <text x="16" y="194" fill="#f8fafc" font-size="12" font-weight="600">External (E) &amp; Mid-Ord (M):</text>
    <text x="26" y="212" fill="#fbbf24" font-family="monospace" font-size="12">E = R(sec(Δ/2)-1) | M = R(1-cos(Δ/2))</text>

    <!-- Casio Code Snippet Box -->
    <rect x="0" y="246" width="290" height="194" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="246" width="290" height="30" rx="12" fill="#1e293b"/>
    <circle cx="16" cy="261" r="5" fill="#f43f5e"/>
    <circle cx="32" cy="261" r="5" fill="#fbbf24"/>
    <circle cx="48" cy="261" r="5" fill="#10b981"/>
    <text x="70" y="266" fill="#94a3b8" font-size="11" font-weight="600">Casio fx-5800P BASIC Token</text>

    <text x="16" y="300" fill="#818cf8" font-family="monospace" font-size="12">"R"?→R:"DELTA"?→D</text>
    <text x="16" y="324" fill="#38bdf8" font-family="monospace" font-size="12">R×tan(D÷2)→T◢</text>
    <text x="16" y="348" fill="#38bdf8" font-family="monospace" font-size="12">π×R×D÷180→L◢</text>
    <text x="16" y="372" fill="#34d399" font-family="monospace" font-size="12">2×R×sin(D÷2)→C◢</text>
    <text x="16" y="396" fill="#fbbf24" font-family="monospace" font-size="12">R×(1÷cos(D÷2)-1)→E◢</text>
    <text x="16" y="420" fill="#a855f7" font-family="monospace" font-size="12">"CHAINAGE PC"?→P:P+L→Q◢</text>
  </g>
</svg>