<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="editStudioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="editStudioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#editStudioGrad)" filter="url(#editStudioGlow)"/>
  
  <!-- PDF Sheet -->
  <path d="M16 13 H36 L46 23 V51 H16 Z" fill="#FFFFFF" fill-opacity="0.96"/>
  <path d="M36 13 V23 H46" fill="#CBD5E1"/>
  
  <!-- Document Text Lines -->
  <line x1="21" y1="23" x2="32" y2="23" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Fluorescent Highlighter Mark on Text -->
  <rect x="20" y="28" width="22" height="6" rx="2" fill="#FACC15" fill-opacity="0.75"/>
  <line x1="21" y1="31" x2="38" y2="31" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Geometric Markup Shape (Rectangle Stamp) -->
  <rect x="21" y="38" width="16" height="8" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2 1"/>
  <text x="29" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="5" fill="#DC2626" text-anchor="middle">EDIT</text>
  
  <!-- Directional Markup Arrow -->
  <path d="M39 44 L44 39 M44 39 H40 M44 39 V43" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Vibrant Editing Pencil / Marker Tool -->
  <g transform="translate(32, 16) rotate(42)">
    <rect x="-3" y="-14" width="6" height="18" rx="1.5" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
    <path d="M-3 4 L0 9 L3 4 Z" fill="#FDE68A" stroke="#B45309" stroke-width="0.8"/>
    <polygon points="-1,6 0,9 1,6" fill="#1E293B"/>
    <rect x="-3" y="-18" width="6" height="4" rx="1" fill="#E2E8F0"/>
    <rect x="-3" y="-20" width="6" height="2" rx="0.5" fill="#EF4444"/>
  </g>
</svg>
