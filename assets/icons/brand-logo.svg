<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ld-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A1122" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="ld-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Crystal Document Gradients -->
    <linearGradient id="doc-primary" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#034574" />
    </linearGradient>

    <linearGradient id="doc-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="doc-fold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Scanner Aperture & Iris Gradients -->
    <linearGradient id="iris-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="25%" stop-color="#34D399" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#34D399" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glint Shimmer -->
    <linearGradient id="glass-glint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ld-bg-grad)" stroke="#1E293B" stroke-width="6" />

  <!-- Ambient Glow behind Document -->
  <circle cx="230" cy="230" r="160" fill="#0284C7" opacity="0.18" filter="url(#ld-glow)" />
  <circle cx="310" cy="310" r="130" fill="#10B981" opacity="0.22" filter="url(#ld-glow)" />

  <!-- Isometric Layered Geometric Document Body -->
  <g id="crystal-document" transform="translate(18, 12)">
    <!-- Back Crystal Drop Shadow / Depth Plane -->
    <path d="M140 100 L310 100 L390 180 L390 380 C390 398 376 412 358 412 L140 412 C122 412 108 398 108 380 L108 132 C108 114 122 100 140 100 Z" 
          fill="#071226" opacity="0.75" />

    <!-- Main Crystal Prism Document Slab -->
    <path d="M152 92 L312 92 L388 168 L388 372 C388 390 374 404 356 404 L152 404 C134 404 120 390 120 372 L120 124 C120 106 134 92 152 92 Z" 
          fill="url(#doc-primary)" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round" />

    <!-- Isometric Top-Left Reflective Facet -->
    <path d="M124 126 C124 108 138 94 154 94 L310 94 L330 140 L160 380 L124 360 Z" 
          fill="url(#glass-glint)" opacity="0.45" />

    <!-- Folded Geometric Top-Right Flap -->
    <path d="M312 92 L388 168 L328 168 C319 168 312 161 312 152 Z" 
          fill="url(#doc-fold)" stroke="#BAE6FD" stroke-width="3" stroke-linejoin="round" />
    <path d="M312 92 L388 168 L312 168 Z" fill="#034574" opacity="0.3" />

    <!-- Optical Scanner Glass Frame & Sensor Ring -->
    <g id="scanner-iris" transform="translate(254, 268)">
      <!-- Outer Glass Housing Circle -->
      <circle cx="0" cy="0" r="92" fill="#0B132B" stroke="#1E293B" stroke-width="5" />
      <circle cx="0" cy="0" r="82" fill="#080E1E" stroke="url(#iris-ring)" stroke-width="4" stroke-dasharray="14 6" />

      <!-- Optical Camera Aperture Blades (Geometric Pentagon / Hexagon Iris) -->
      <polygon points="0,-64 55,-32 55,32 0,64 -55,32 -55,-32" fill="#0A1628" stroke="#38BDF8" stroke-width="2.5" />
      <circle cx="0" cy="0" r="46" fill="#030A16" stroke="#10B981" stroke-width="3" />
      
      <!-- Inner Glowing Core Sensor -->
      <circle cx="0" cy="0" r="28" fill="url(#iris-ring)" />
      <circle cx="-8" cy="-8" r="8" fill="#FFFFFF" opacity="0.85" />
      <circle cx="8" cy="8" r="4" fill="#A7F3D0" opacity="0.6" />

      <!-- High-Tech Camera HUD Corner Brackets (Target Reticle) -->
      <path d="M-60 -42 L-72 -42 L-72 -30" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M60 -42 L72 -42 L72 -30" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M-60 42 L-72 42 L-72 30" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M60 42 L72 42 L72 30" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none" />

      <!-- Laser Scan Sweep Line across Viewfinder -->
      <rect x="-92" y="-3" width="184" height="6" fill="url(#laser-beam)" />
    </g>

    <!-- Zero-Upload Offline RAM Security Shield Badge (Bottom-Right) -->
    <g id="security-shield" transform="translate(320, 334)">
      <!-- Shield Drop Shadow -->
      <path d="M38 0 C64 0 76 18 76 38 C76 68 44 94 38 98 C32 94 0 68 0 38 C0 18 12 0 38 0 Z" 
            fill="#000000" opacity="0.55" transform="translate(0, 5)" />

      <!-- Shield Base -->
      <path d="M38 0 C64 0 76 18 76 38 C76 68 44 94 38 98 C32 94 0 68 0 38 C0 18 12 0 38 0 Z" 
            fill="url(#shield-grad)" stroke="#A7F3D0" stroke-width="3.5" />

      <!-- Bold White Lock Graphic inside Shield -->
      <!-- Shackle -->
      <path d="M28 36 V28 C28 22.5 32.5 18 38 18 C43.5 18 48 22.5 48 28 V36" 
            fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <!-- Lock Body -->
      <rect x="22" y="34" width="32" height="26" rx="6" fill="#FFFFFF" />
      <!-- Keyhole -->
      <circle cx="38" cy="45" r="3.5" fill="#065F46" />
      <path d="M38 46 L38 52" stroke="#065F46" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
