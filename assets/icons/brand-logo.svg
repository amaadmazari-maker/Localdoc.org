<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient Palettes -->
    <linearGradient id="ld-base-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="ld-prism-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#034574" />
    </linearGradient>

    <linearGradient id="ld-fold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="ld-emerald-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="ld-glass-glint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="ld-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow for Retina Vibrancy -->
  <circle cx="230" cy="220" r="170" fill="#0284C7" opacity="0.22" filter="url(#ld-soft-glow)" />
  <circle cx="340" cy="330" r="140" fill="#10B981" opacity="0.2" filter="url(#ld-soft-glow)" />

  <!-- Main Crystal Document Form (Folded Prism) -->
  <g transform="translate(16, 8)">
    <!-- Document Drop Shadow Layer -->
    <path d="M148 76 L332 76 L424 168 L424 416 C424 438 406 456 384 456 L148 456 C126 456 108 438 108 416 L108 116 C108 94 126 76 148 76 Z" 
          fill="#031E38" opacity="0.32" />

    <!-- Isometric Prism Document Slab -->
    <path d="M148 68 L332 68 L424 160 L424 408 C424 430 406 448 384 448 L148 448 C126 448 108 430 108 408 L108 108 C108 86 126 68 148 68 Z" 
          fill="url(#ld-prism-face)" stroke="#7DD3FC" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Glass Surface Specular Sheen -->
    <path d="M112 112 C112 90 128 72 150 72 L330 72 L180 444 L144 444 C124 444 112 428 112 408 Z" 
          fill="url(#ld-glass-glint)" opacity="0.5" />

    <!-- Top-Right Geometric Fold Flap -->
    <path d="M332 68 L424 160 L356 160 C343 160 332 149 332 136 Z" 
          fill="url(#ld-fold-grad)" stroke="#E0F2FE" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M332 68 L424 160 L332 160 Z" fill="#024B7E" opacity="0.4" />

    <!-- Precision Data / Equation Architecture Lines -->
    <g transform="translate(160, 168)">
      <!-- Line 1: Primary Document Header Bar -->
      <rect x="0" y="0" width="130" height="12" rx="6" fill="#FFFFFF" opacity="0.95" />
      
      <!-- Line 2: Matrix & Equation Line with Math Sum & Integral Symbols -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="180" height="8" rx="4" fill="#BAE6FD" opacity="0.8" />
        <circle cx="198" cy="4" r="4.5" fill="#38BDF8" />
        <circle cx="214" cy="4" r="4.5" fill="#38BDF8" />
      </g>

      <!-- Line 3: Mathematical Graph Function Wave -->
      <g transform="translate(0, 60)">
        <path d="M0 16 Q30 0 60 16 T120 16 T180 16" fill="none" stroke="#BAE6FD" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />
        <rect x="195" y="12" width="28" height="8" rx="4" fill="#7DD3FC" opacity="0.85" />
      </g>

      <!-- Line 4: Compact Grid Block -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="90" height="7" rx="3.5" fill="#BAE6FD" opacity="0.6" />
        <rect x="105" y="0" width="55" height="7" rx="3.5" fill="#BAE6FD" opacity="0.45" />
      </g>
    </g>

    <!-- Camera / Optical Scanner Focal Lens Aperture -->
    <g transform="translate(230, 345)">
      <!-- Outer Aperture Ring -->
      <circle cx="0" cy="0" r="46" fill="#031E38" stroke="#38BDF8" stroke-width="3.5" opacity="0.85" />
      <circle cx="0" cy="0" r="36" fill="#082A4D" stroke="#34D399" stroke-width="2.5" stroke-dasharray="8 4" />
      <!-- Camera Target Viewfinder Reticle -->
      <path d="M-28 -18 L-36 -18 L-36 -10" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M28 -18 L36 -18 L36 -10" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M-28 18 L-36 18 L-36 10" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M28 18 L36 18 L36 10" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Scanning Laser Beam -->
      <line x1="-42" y1="0" x2="42" y2="0" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="4" fill="#10B981" />
    </g>

    <!-- Zero-Upload Privacy Shield Emblem (Bottom-Right) -->
    <g transform="translate(340, 320)">
      <!-- Shield Drop Shadow -->
      <path d="M44 0 C76 0 90 22 90 46 C90 82 52 112 44 118 C36 112 0 82 0 46 C0 22 14 0 44 0 Z" 
            fill="#011424" opacity="0.45" transform="translate(0, 6)" />

      <!-- Shield Base (Luminous Emerald) -->
      <path d="M44 0 C76 0 90 22 90 46 C90 82 52 112 44 118 C36 112 0 82 0 46 C0 22 14 0 44 0 Z" 
            fill="url(#ld-emerald-badge)" stroke="#A7F3D0" stroke-width="4" />

      <!-- Lock Shackle -->
      <path d="M32 44 V34 C32 27.5 37.5 22 44 22 C50.5 22 56 27.5 56 34 V44" 
            fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

      <!-- Lock Body -->
      <rect x="25" y="42" width="38" height="32" rx="7" fill="#FFFFFF" />

      <!-- Keyhole -->
      <circle cx="44" cy="55" r="4.5" fill="#065F46" />
      <path d="M44 56 L44 64" stroke="#065F46" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
