<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Facet 1: Top Luminous Sapphire -->
    <linearGradient id="prism-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Facet 2: Left Deep Cobalt -->
    <linearGradient id="prism-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Facet 3: Right Vivid Emerald -->
    <linearGradient id="prism-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Facet 4: Bottom Dynamic Cyan-Emerald -->
    <linearGradient id="prism-bottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Center Core Shield Emblem Glow -->
    <linearGradient id="prism-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="prism-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="180" fill="#0284C7" opacity="0.16" filter="url(#prism-glow)" />
  <circle cx="280" cy="270" r="140" fill="#10B981" opacity="0.14" filter="url(#prism-glow)" />

  <!-- 3D Geometric Prism Geometry (Option 1 Concept) -->
  <g transform="translate(256, 256)">
    <!-- Base Drop Shadow -->
    <path d="M0 -190 L165 -95 L165 95 L0 190 L-165 95 L-165 -95 Z" 
          fill="#0B132B" opacity="0.25" transform="translate(0, 16)" />

    <!-- Top Left Facet (Cobalt Sapphire) -->
    <path d="M0 -190 L-165 -95 L0 0 Z" fill="url(#prism-left)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round" />

    <!-- Top Right Facet (Bright Electric Sapphire) -->
    <path d="M0 -190 L165 -95 L0 0 Z" fill="url(#prism-top)" stroke="#7DD3FC" stroke-width="2" stroke-linejoin="round" />

    <!-- Bottom Right Facet (Vivid Emerald) -->
    <path d="M165 -95 L165 95 L0 0 Z" fill="url(#prism-right)" stroke="#6EE7B7" stroke-width="2" stroke-linejoin="round" />

    <!-- Bottom Left Facet (Luminous Cyan-Emerald) -->
    <path d="M0 190 L-165 95 L0 0 Z" fill="url(#prism-bottom)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round" />

    <!-- Bottom Center Right Facet -->
    <path d="M0 190 L165 95 L0 0 Z" fill="url(#prism-right)" opacity="0.85" stroke="#34D399" stroke-width="2" stroke-linejoin="round" />

    <!-- Left Lateral Facet -->
    <path d="M-165 -95 L-165 95 L0 0 Z" fill="url(#prism-left)" opacity="0.9" stroke="#0284C7" stroke-width="2" stroke-linejoin="round" />

    <!-- Specular Light Sheen Triangle Across Top Edge -->
    <path d="M0 -190 L-165 -95 L0 -120 Z" fill="#FFFFFF" opacity="0.35" />
    <path d="M0 -190 L165 -95 L0 -120 Z" fill="#FFFFFF" opacity="0.45" />

    <!-- Geometric Inner Prism Center Y-Triad (3-Fold Symmetry Axis) -->
    <line x1="0" y1="0" x2="0" y2="-190" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="0" y1="0" x2="-165" y2="95" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="0" y1="0" x2="165" y2="95" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- Center Nucleus: Secure Zero-Upload Client Core -->
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="0" r="8" fill="#0284C7" />
  </g>
</svg>
