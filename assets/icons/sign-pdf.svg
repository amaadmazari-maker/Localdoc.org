<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="signStudioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="signStudioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#signStudioGrad)" filter="url(#signStudioGlow)"/>
  
  <!-- Legal Contract Sheet -->
  <path d="M16 13 H36 L46 23 V51 H16 Z" fill="#FFFFFF" fill-opacity="0.96"/>
  <path d="M36 13 V23 H46" fill="#D1FAE5"/>
  
  <!-- Contract Text Lines -->
  <line x1="21" y1="22" x2="33" y2="22" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="28" x2="40" y2="28" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="21" y1="33" x2="35" y2="33" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Signature Line -->
  <line x1="21" y1="44" x2="41" y2="44" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <text x="21" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="4" fill="#94A3B8">SIGNATURE</text>
  
  <!-- Fluid Cursive Signature -->
  <path d="M22 41 C24 37, 26 43, 28 39 C30 35, 32 42, 35 38 C37 36, 39 42, 42 39" stroke="#1E3A8A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Circular Corporate Rubber Seal / Stamp -->
  <g transform="translate(39, 41)">
    <circle cx="0" cy="0" r="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="6.5" fill="none" stroke="#DC2626" stroke-width="0.7"/>
    <polygon points="0,-3 1,-1 3,-1 1.5,0.5 2,2.5 0,1.2 -2,2.5 -1.5,0.5 -3,-1 -1,-1" fill="#DC2626"/>
  </g>
  
  <!-- Stylus / Quill Tip -->
  <g transform="translate(34, 28) rotate(35)">
    <path d="M0 -14 L3 -14 L2 4 L0 8 L-2 4 L-3 -14 Z" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
    <polygon points="0,8 1,5 -1,5" fill="#0F172A"/>
  </g>
</svg>
