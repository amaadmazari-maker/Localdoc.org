<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cnicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="cnicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#cnicGrad)" filter="url(#cnicGlow)"/>
  <!-- Smart Card Base -->
  <rect x="14" y="18" width="36" height="28" rx="4" fill="#FFFFFF"/>
  <!-- Header Bar (Green) -->
  <path d="M14 22 C14 19.8 15.8 18 18 18 H46 C48.2 18 50 19.8 50 22 V25 H14 Z" fill="#047857"/>
  <!-- Biometric Photo Box -->
  <rect x="18" y="28" width="10" height="13" rx="1.5" fill="#E2E8F0" stroke="#047857" stroke-width="0.8"/>
  <circle cx="23" cy="32" r="2" fill="#047857"/>
  <path d="M20 39 C20 36 26 36 26 39 Z" fill="#047857"/>
  <!-- Microchip -->
  <rect x="32" y="28" width="6" height="5" rx="1" fill="#F59E0B"/>
  <!-- Text lines on Card -->
  <line x1="32" y1="36" x2="46" y2="36" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="39" x2="42" y2="39" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
