<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="invCharGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <filter id="invCharGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#invCharGrad)" filter="url(#invCharGlow)"/>
  <!-- Dashed Empty Character Box -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="5 3"/>
  <!-- Subtle Center Cursor / Zero-Width indicator -->
  <line x1="32" y1="24" x2="32" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <polyline points="29 27 32 24 35 27" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <polyline points="29 37 32 40 35 37" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
