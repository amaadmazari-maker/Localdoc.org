<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Calculator Body Bevel Gradient -->
    <linearGradient id="calc-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- LCD Matrix Display Screen Gradient -->
    <linearGradient id="calc-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9F99D" />
      <stop offset="100%" stop-color="#BEF264" />
    </linearGradient>

    <!-- Solar Cell Gradient -->
    <linearGradient id="calc-solar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- D-Pad Directional Wheel Gradient -->
    <linearGradient id="calc-dpad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="calc-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Calculator Chassis with Shadow -->
  <rect x="18" y="8" width="92" height="112" rx="14" fill="url(#calc-body)" stroke="#475569" stroke-width="2.5" filter="url(#calc-shadow)" />

  <!-- Inner Bevel Highlight -->
  <rect x="22" y="12" width="84" height="104" rx="11" fill="none" stroke="#64748B" stroke-width="1" opacity="0.4" />

  <!-- Top Brand & Solar Cell Row -->
  <g transform="translate(26, 17)">
    <!-- Brand / Model Text -->
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="800" fill="#94A3B8" letter-spacing="0.08em">fx-5800P PRO</text>
    
    <!-- Solar Energy Panel -->
    <rect x="52" y="1" width="24" height="8" rx="2" fill="url(#calc-solar)" stroke="#292524" stroke-width="1" />
    <line x1="60" y1="1" x2="60" y2="9" stroke="#78350F" stroke-width="1" />
    <line x1="68" y1="1" x2="68" y2="9" stroke="#78350F" stroke-width="1" />
  </g>

  <!-- High-Contrast Multi-Line LCD Dot Matrix Display Screen -->
  <g transform="translate(24, 29)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="url(#calc-screen)" stroke="#1E293B" stroke-width="1.8" />
    
    <!-- Equation Line 1 -->
    <text x="4" y="9" font-family="'Courier New', monospace" font-size="7" font-weight="700" fill="#14532D" letter-spacing="-0.02em">sin(30°)+√144=</text>
    <!-- Result Line 2 -->
    <text x="76" y="20" font-family="'Courier New', monospace" font-size="10.5" font-weight="900" fill="#052E16" text-anchor="end" letter-spacing="-0.03em">12.5000</text>
  </g>

  <!-- Scientific Function Keys Row 1 (Shift, Alpha, Mode, Replay Wheel) -->
  <g transform="translate(24, 57)">
    <!-- Shift Key (Golden Yellow) -->
    <rect x="0" y="1" width="10" height="6" rx="2" fill="#D97706" />
    <text x="5" y="5.5" font-family="sans-serif" font-size="3.5" font-weight="800" fill="#FFF" text-anchor="middle">S</text>

    <!-- Alpha Key (Ruby Red) -->
    <rect x="13" y="1" width="10" height="6" rx="2" fill="#DC2626" />
    <text x="18" y="5.5" font-family="sans-serif" font-size="3.5" font-weight="800" fill="#FFF" text-anchor="middle">A</text>

    <!-- Center Oval Replay D-Pad Wheel -->
    <ellipse cx="40" cy="4" rx="11" ry="6" fill="url(#calc-dpad)" stroke="#64748B" stroke-width="1.2" />
    <polygon points="40,0 38,2 42,2" fill="#94A3B8" />
    <polygon points="40,8 38,6 42,6" fill="#94A3B8" />
    <polygon points="32,4 34,2 34,6" fill="#94A3B8" />
    <polygon points="48,4 46,2 46,6" fill="#94A3B8" />

    <!-- Mode Key -->
    <rect x="57" y="1" width="10" height="6" rx="2" fill="#334155" />
    <text x="62" y="5.5" font-family="sans-serif" font-size="3.5" font-weight="700" fill="#CBD5E1" text-anchor="middle">MODE</text>

    <!-- On Key -->
    <rect x="70" y="1" width="10" height="6" rx="2" fill="#334155" />
    <text x="75" y="5.5" font-family="sans-serif" font-size="3.5" font-weight="700" fill="#CBD5E1" text-anchor="middle">ON</text>
  </g>

  <!-- Scientific Keys Row 2 (x², √, log, ln, sin, cos, tan) -->
  <g transform="translate(24, 67)">
    <rect x="0" y="0" width="13" height="6" rx="2" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="6.5" y="4.5" font-family="sans-serif" font-size="4" font-weight="700" fill="#94A3B8" text-anchor="middle">x²</text>

    <rect x="16" y="0" width="13" height="6" rx="2" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="22.5" y="4.5" font-family="sans-serif" font-size="4" font-weight="700" fill="#94A3B8" text-anchor="middle">√</text>

    <rect x="33" y="0" width="14" height="6" rx="2" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="40" y="4.5" font-family="sans-serif" font-size="3.8" font-weight="700" fill="#94A3B8" text-anchor="middle">log</text>

    <rect x="50" y="0" width="13" height="6" rx="2" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="56.5" y="4.5" font-family="sans-serif" font-size="4" font-weight="700" fill="#94A3B8" text-anchor="middle">sin</text>

    <rect x="66" y="0" width="14" height="6" rx="2" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="73" y="4.5" font-family="sans-serif" font-size="4" font-weight="700" fill="#94A3B8" text-anchor="middle">cos</text>
  </g>

  <!-- Main Numeric Keypad Grid (4 Rows x 5 Columns) -->
  <g transform="translate(24, 76)">
    <!-- Row 1: 7, 8, 9, DEL, AC -->
    <rect x="0" y="0" width="13" height="8" rx="2.5" fill="#334155" />
    <text x="6.5" y="5.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">7</text>

    <rect x="16" y="0" width="13" height="8" rx="2.5" fill="#334155" />
    <text x="22.5" y="5.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">8</text>

    <rect x="33" y="0" width="14" height="8" rx="2.5" fill="#334155" />
    <text x="40" y="5.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">9</text>

    <rect x="50" y="0" width="13" height="8" rx="2.5" fill="#EA580C" />
    <text x="56.5" y="5.8" font-family="sans-serif" font-size="4.5" font-weight="800" fill="#FFF" text-anchor="middle">DEL</text>

    <rect x="66" y="0" width="14" height="8" rx="2.5" fill="#DC2626" />
    <text x="73" y="5.8" font-family="sans-serif" font-size="4.5" font-weight="800" fill="#FFF" text-anchor="middle">AC</text>

    <!-- Row 2: 4, 5, 6, ×, ÷ -->
    <rect x="0" y="10" width="13" height="8" rx="2.5" fill="#334155" />
    <text x="6.5" y="15.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">4</text>

    <rect x="16" y="10" width="13" height="8" rx="2.5" fill="#334155" />
    <text x="22.5" y="15.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">5</text>

    <rect x="33" y="10" width="14" height="8" rx="2.5" fill="#334155" />
    <text x="40" y="15.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">6</text>

    <rect x="50" y="10" width="13" height="8" rx="2.5" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
    <text x="56.5" y="15.8" font-family="sans-serif" font-size="6" font-weight="800" fill="#38BDF8" text-anchor="middle">×</text>

    <rect x="66" y="10" width="14" height="8" rx="2.5" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
    <text x="73" y="15.8" font-family="sans-serif" font-size="6" font-weight="800" fill="#38BDF8" text-anchor="middle">÷</text>

    <!-- Row 3: 1, 2, 3, +, − -->
    <rect x="0" y="20" width="13" height="8" rx="2.5" fill="#334155" />
    <text x="6.5" y="25.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">1</text>

    <rect x="16" y="20" width="13" height="8" rx="2.5" fill="#334155" />
    <text x="22.5" y="25.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">2</text>

    <rect x="33" y="20" width="14" height="8" rx="2.5" fill="#334155" />
    <text x="40" y="25.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">3</text>

    <rect x="50" y="20" width="13" height="8" rx="2.5" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
    <text x="56.5" y="25.8" font-family="sans-serif" font-size="6" font-weight="800" fill="#38BDF8" text-anchor="middle">+</text>

    <rect x="66" y="20" width="14" height="8" rx="2.5" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
    <text x="73" y="25.8" font-family="sans-serif" font-size="6" font-weight="800" fill="#38BDF8" text-anchor="middle">−</text>

    <!-- Row 4: 0, ., ×10ˣ, Ans, = -->
    <rect x="0" y="30" width="13" height="8" rx="2.5" fill="#334155" />
    <text x="6.5" y="35.8" font-family="sans-serif" font-size="5.5" font-weight="800" fill="#F8FAFC" text-anchor="middle">0</text>

    <rect x="16" y="30" width="13" height="8" rx="2.5" fill="#334155" />
    <text x="22.5" y="35.8" font-family="sans-serif" font-size="6" font-weight="900" fill="#F8FAFC" text-anchor="middle">.</text>

    <rect x="33" y="30" width="14" height="8" rx="2.5" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
    <text x="40" y="35.5" font-family="sans-serif" font-size="3.8" font-weight="800" fill="#CBD5E1" text-anchor="middle">×10ˣ</text>

    <rect x="50" y="30" width="13" height="8" rx="2.5" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
    <text x="56.5" y="35.5" font-family="sans-serif" font-size="4" font-weight="800" fill="#CBD5E1" text-anchor="middle">Ans</text>

    <!-- The Equal Key (Vibrant Sapphire) -->
    <rect x="66" y="30" width="14" height="8" rx="2.5" fill="#0284C7" stroke="#38BDF8" stroke-width="1" />
    <text x="73" y="36" font-family="sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">=</text>
  </g>
</svg>
